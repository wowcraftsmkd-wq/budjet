<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ad budget tracker</title>
<style>
  :root{
    --surface-2:#ffffff; --surface-1:#f5f4f0; --surface-0:#f0efe9;
    --text-primary:#1a1a1a; --text-secondary:#5f5e5a; --border:#d8d6cf; --border-strong:#b4b2a9;
    --bg-red:#FCEBEB; --border-red:#E24B4A; --text-red:#791F1F; --fill-red:#D85A30; --on-red:#ffffff;
    --bg-amber:#FAEEDA; --border-amber:#BA7517; --text-amber:#633806; --fill-amber:#EF9F27; --on-amber:#412402;
    --bg-green:#EAF3DE; --border-green:#639922; --text-green:#27500A; --fill-green:#639922; --on-green:#ffffff;
    --bg-danger:#FCEBEB; --text-danger:#791F1F;
    --bg-warning:#FAEEDA; --text-warning:#633806;
    --bg-success:#EAF3DE; --text-success:#27500A;
    --radius:8px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; padding:24px; background:var(--surface-0);
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color:var(--text-primary); line-height:1.5;
  }
  #app{ max-width:760px; margin:0 auto; }
  .sr-only{
    position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden;
    clip:rect(0,0,0,0); white-space:nowrap; border:0;
  }
  h2{ font-size:18px; font-weight:500; margin:0; }
  input, select, textarea{
    height:36px; border:1px solid var(--border); border-radius:var(--radius);
    padding:0 10px; font-size:14px; background:#fff; color:var(--text-primary); width:100%;
    font-family:inherit;
  }
  input:focus{ outline:none; border-color:#378ADD; box-shadow:0 0 0 2px rgba(55,138,221,0.25); }
  button{
    height:36px; border:1px solid var(--border-strong); border-radius:var(--radius);
    background:#fff; color:var(--text-primary); font-size:14px; padding:0 14px; cursor:pointer;
    font-family:inherit; transition:background .15s;
  }
  button:hover{ background:var(--surface-1); }
  button:active{ transform:scale(0.98); }
  textarea{
    border:1px solid var(--border); border-radius:var(--radius);
    padding:8px 10px; font-size:13px; background:#fff; color:var(--text-primary); width:100%;
    font-family:inherit; resize:vertical;
  }
  textarea:focus{ outline:none; border-color:#378ADD; box-shadow:0 0 0 2px rgba(55,138,221,0.25); }
  label{ font-size:13px; color:var(--text-secondary); display:block; margin-bottom:4px; }
  .arrow{ font-weight:600; display:inline-block; }
  .arrow-black{ color:#1a1a1a; }
  .arrow-blue{ color:#378ADD; }
  .notesArea{
    width:100%; min-width:160px; min-height:44px; font-size:12px; padding:6px 8px;
    border:1px solid var(--border); border-radius:6px; background:#fff; resize:vertical;
  }
  #syncBanner{ font-size:12px; padding:8px 12px; border-radius:var(--radius); margin-bottom:12px; display:none; }
  #syncBanner.ok{ background:var(--bg-success); color:var(--text-success); display:block; }
  #syncBanner.warn{ background:var(--bg-warning); color:var(--text-warning); display:block; }
</style>
</head>
<body>
<div id="app">
  <h2 class="sr-only">Client ad budget tracker showing days remaining before top-up is needed</h2>
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
    <div>
      <div style="font-size:22px; font-weight:500;">Ad budget tracker</div>
      <div style="font-size:13px; color:var(--text-secondary);">Shared with your team — everyone opening this sees the same data</div>
    </div>
    <div style="display:flex; gap:8px;">
      <button id="viewToggle"><span class="arrow arrow-black" style="margin-right:5px;">&#8594;</span>Sheet view</button>
      <button id="bulkBtn"><span class="arrow arrow-black" style="margin-right:5px;">&#8594;</span>Bulk add</button>
      <button id="addBtn"><span class="arrow arrow-blue" style="margin-right:5px;">+</span>Add client</button>
    </div>
  </div>

  <div id="syncBanner"></div>

  <div id="summary" style="display:grid; grid-template-columns:repeat(auto-fit, minmax(140px,1fr)); gap:12px; margin-bottom:1.5rem;"></div>

  <div id="list" style="display:flex; flex-direction:column; gap:10px;"></div>
  <div id="sheetWrap" style="display:none; overflow-x:auto;"></div>
  <div id="empty" style="display:none; text-align:center; padding:2rem; color:var(--text-secondary); font-size:14px;">
    Client illa ippol. "Add client" click cheythu thudangu.
  </div>
</div>

<div id="modalRoot"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css"></script>
<script>
(function(){
  const KEY = 'clients';
  let clients = [];

  function daysLeft(c){
    const end = new Date(c.endDate + 'T23:59:59');
    return (end.getTime() - Date.now()) / 86400000;
  }
  function endDateStr(c){
    const end = new Date(c.endDate + 'T00:00:00');
    return end.toLocaleDateString('en-IN', {day:'numeric', month:'short', year:'numeric'});
  }
  function calcEndDate(startStr, daily, amount){
    const start = new Date(startStr + 'T00:00:00');
    const totalDays = daily > 0 ? amount / daily : 0;
    const end = new Date(start.getTime() + totalDays*86400000);
    return end.toISOString().slice(0,10);
  }
  function statusColor(d){
    if(d <= 2) return 'red';
    if(d <= 4) return 'amber';
    return 'green';
  }

  const hasCloudStorage = typeof window.storage !== 'undefined';

  // --- Shared-link storage for when this file is hosted outside Claude (e.g. GitHub Pages) ---
  // Uses jsonblob.com's free, keyless JSON storage. The blob id lives in the URL (?blob=...),
  // so sharing the exact URL shares the same live data with anyone who opens it.
  const params = new URLSearchParams(window.location.search);
  let blobId = params.get('blob');
  let blobBroken = false;

  function showBanner(text, kind){
    const b = document.getElementById('syncBanner');
    b.textContent = text;
    b.className = kind;
  }

  async function ensureBlob(){
    if(blobId || hasCloudStorage) return;
    try{
      const res = await fetch('https://jsonblob.com/api/jsonBlob', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify([])
      });
      const loc = res.headers.get('Location');
      blobId = loc ? loc.split('/').pop() : null;
      if(blobId){
        const url = new URL(window.location.href);
        url.searchParams.set('blob', blobId);
        window.history.replaceState({}, '', url.toString());
        showBanner('Shared link ready. Copy this page\'s URL from the address bar and send it to your team — everyone who opens it will see and edit the same data.', 'ok');
      } else {
        blobBroken = true;
      }
    }catch(e){ blobBroken = true; }
  }

  async function load(){
    try{
      if(hasCloudStorage){
        const res = await window.storage.get(KEY, true);
        clients = res ? JSON.parse(res.value) : [];
      } else {
        await ensureBlob();
        if(blobId && !blobBroken){
          const res = await fetch(`https://jsonblob.com/api/jsonBlob/${blobId}`);
          if(!res.ok) throw new Error('blob fetch failed');
          clients = await res.json();
          if(!Array.isArray(clients)) clients = [];
        } else {
          const raw = localStorage.getItem(KEY);
          clients = raw ? JSON.parse(raw) : [];
          if(blobBroken){
            showBanner('Shared sync ondayilla — data eee browser-il mathram save aavunnu. Internet check cheythu page reload cheyyu.', 'warn');
          }
        }
      }
    }catch(e){
      clients = [];
      blobBroken = true;
      const raw = localStorage.getItem(KEY);
      if(raw){ try{ clients = JSON.parse(raw); }catch(_e){} }
      showBanner('Shared sync ondayilla — data eee browser-il mathram save aavunnu. Internet check cheythu page reload cheyyu.', 'warn');
    }
    render();
  }
  async function save(){
    try{
      if(hasCloudStorage){
        await window.storage.set(KEY, JSON.stringify(clients), true);
      } else if(blobId && !blobBroken){
        const res = await fetch(`https://jsonblob.com/api/jsonBlob/${blobId}`, {
          method: 'PUT',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify(clients)
        });
        if(!res.ok) throw new Error('blob save failed');
        localStorage.setItem(KEY, JSON.stringify(clients)); // offline backup
      } else {
        localStorage.setItem(KEY, JSON.stringify(clients));
      }
    }catch(e){
      console.error(e);
      localStorage.setItem(KEY, JSON.stringify(clients));
      showBanner('Save cheyyan pattiyilla shared link-il — offline aayirikkam. Internet check cheyyu.', 'warn');
    }
  }

  let sheetView = false;

  function render(){
    const list = document.getElementById('list');
    const sheetWrap = document.getElementById('sheetWrap');
    const empty = document.getElementById('empty');
    const summary = document.getElementById('summary');
    list.innerHTML = '';
    sheetWrap.innerHTML = '';

    if(clients.length === 0){
      empty.style.display = 'block';
    } else {
      empty.style.display = 'none';
    }

    list.style.display = sheetView ? 'none' : 'flex';
    sheetWrap.style.display = sheetView ? 'block' : 'none';

    const sorted = [...clients].sort((a,b) => daysLeft(a) - daysLeft(b));
    const urgent = clients.filter(c => daysLeft(c) <= 2).length;
    const soon = clients.filter(c => { const d = daysLeft(c); return d > 2 && d <= 4; }).length;
    const safe = clients.length - urgent - soon;

    summary.innerHTML = `
      <div style="background:var(--surface-1); border-radius:var(--radius); padding:1rem;">
        <div style="font-size:13px; color:var(--text-secondary);">Total clients</div>
        <div style="font-size:24px; font-weight:500;">${clients.length}</div>
      </div>
      <div style="background:var(--bg-danger); border-radius:var(--radius); padding:1rem;">
        <div style="font-size:13px; color:var(--text-danger);">Urgent (&le;2 days)</div>
        <div style="font-size:24px; font-weight:500; color:var(--text-danger);">${urgent}</div>
      </div>
      <div style="background:var(--bg-warning); border-radius:var(--radius); padding:1rem;">
        <div style="font-size:13px; color:var(--text-warning);">Soon (&le;4 days)</div>
        <div style="font-size:24px; font-weight:500; color:var(--text-warning);">${soon}</div>
      </div>
      <div style="background:var(--bg-success); border-radius:var(--radius); padding:1rem;">
        <div style="font-size:13px; color:var(--text-success);">Safe</div>
        <div style="font-size:24px; font-weight:500; color:var(--text-success);">${safe}</div>
      </div>
    `;

    sorted.forEach(c => {
      const d = daysLeft(c);
      const color = statusColor(d);
      const dLabel = d <= 0 ? 'Amount theernnu' : `${Math.floor(d)}d ${Math.round((d%1)*24)}h left`;
      const row = document.createElement('div');
      row.style.cssText = `background:var(--fill-${color}); border-radius:12px; padding:14px 18px; display:flex; justify-content:space-between; align-items:center; gap:12px;`;
      row.innerHTML = `
        <div style="min-width:0; flex:1; display:flex; align-items:center; gap:12px;">
          <div style="width:36px; height:36px; border-radius:50%; background:rgba(255,255,255,0.25); display:flex; align-items:center; justify-content:center; flex-shrink:0;">
            <span class="arrow" style="font-size:18px; color:var(--on-${color});" aria-hidden="true">&#8594;</span>
          </div>
          <div style="min-width:0;">
            <div style="font-weight:500; font-size:16px; color:var(--on-${color});">${c.name}</div>
            <div style="font-size:13px; color:var(--on-${color}); opacity:0.85; margin-top:2px;">
              Daily &#8377;${c.dailyBudget} &middot; Top-up &#8377;${c.amount} &middot; Ends ${endDateStr(c)}
            </div>
          </div>
        </div>
        <div style="text-align:right; flex-shrink:0;">
          <div style="font-size:15px; font-weight:500; color:var(--on-${color});">${dLabel}</div>
        </div>
        <div style="display:flex; gap:6px; flex-shrink:0;">
          <button class="remindBtn" data-id="${c.id}" style="padding:6px 8px; font-size:13px; background:rgba(255,255,255,0.15); border-color:rgba(255,255,255,0.4); color:var(--on-${color});" aria-label="Set reminder">&#8594;</button>
          <button class="topupBtn" data-id="${c.id}" style="padding:6px 10px; font-size:13px; background:rgba(255,255,255,0.15); border-color:rgba(255,255,255,0.4); color:var(--on-${color});">Topped up</button>
          <button class="delBtn" data-id="${c.id}" aria-label="Delete client" style="padding:6px 8px; background:rgba(255,255,255,0.15); border-color:rgba(255,255,255,0.4); color:var(--on-${color});">&#10005;</button>
        </div>
      `;
      list.appendChild(row);
    });

    if(sorted.length > 0){
      let rowsHtml = '';
      sorted.forEach(c => {
        const d = daysLeft(c);
        const color = statusColor(d);
        const dLabel = d <= 0 ? 'Theernnu' : `${Math.floor(d)}d ${Math.round((d%1)*24)}h`;
        rowsHtml += `
          <tr>
            <td style="padding:8px 12px; border-bottom:1px solid var(--border); font-weight:500;">${c.name}</td>
            <td style="padding:8px 12px; border-bottom:1px solid var(--border);">&#8377;${c.dailyBudget}</td>
            <td style="padding:8px 12px; border-bottom:1px solid var(--border);">&#8377;${c.amount}</td>
            <td style="padding:8px 12px; border-bottom:1px solid var(--border);">${new Date(c.startDate+'T00:00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short'})}</td>
            <td style="padding:8px 12px; border-bottom:1px solid var(--border);">${endDateStr(c)}</td>
            <td style="padding:8px 12px; border-bottom:1px solid var(--border); font-weight:500; color:var(--text-${color});">${dLabel}</td>
            <td style="padding:8px 12px; border-bottom:1px solid var(--border);">
              <textarea class="notesArea notesInput" data-id="${c.id}" rows="2" placeholder="Note ezhuthu...">${c.notes ? c.notes.replace(/"/g,'&quot;') : ''}</textarea>
            </td>
            <td style="padding:8px 12px; border-bottom:1px solid var(--border); white-space:nowrap;">
              <button class="remindBtnSheet" data-id="${c.id}" style="padding:4px 8px; font-size:12px; margin-right:4px;" aria-label="Set reminder">&#8594;</button>
              <button class="topupBtnSheet" data-id="${c.id}" style="padding:4px 8px; font-size:12px; margin-right:4px;">Top-up</button>
              <button class="delBtnSheet" data-id="${c.id}" aria-label="Delete client" style="padding:4px 8px; font-size:12px;">&#10005;</button>
            </td>
          </tr>
        `;
      });
      sheetWrap.innerHTML = `
        <table style="width:100%; border-collapse:collapse; font-size:13px; background:var(--surface-2); border-radius:var(--radius); overflow:hidden;">
          <thead>
            <tr style="background:var(--surface-1);">
              <th style="text-align:left; padding:8px 12px; font-weight:500; color:var(--text-secondary);">Client</th>
              <th style="text-align:left; padding:8px 12px; font-weight:500; color:var(--text-secondary);">Daily</th>
              <th style="text-align:left; padding:8px 12px; font-weight:500; color:var(--text-secondary);">Amount</th>
              <th style="text-align:left; padding:8px 12px; font-weight:500; color:var(--text-secondary);">Start</th>
              <th style="text-align:left; padding:8px 12px; font-weight:500; color:var(--text-secondary);">End</th>
              <th style="text-align:left; padding:8px 12px; font-weight:500; color:var(--text-secondary);">Left</th>
              <th style="text-align:left; padding:8px 12px; font-weight:500; color:var(--text-secondary);">Notes</th>
              <th style="text-align:left; padding:8px 12px; font-weight:500; color:var(--text-secondary);"></th>
            </tr>
          </thead>
          <tbody>${rowsHtml}</tbody>
        </table>
      `;
      sheetWrap.querySelectorAll('.remindBtnSheet').forEach(b => b.onclick = () => remindClient(b.dataset.id));
      sheetWrap.querySelectorAll('.topupBtnSheet').forEach(b => b.onclick = () => topUp(b.dataset.id));
      sheetWrap.querySelectorAll('.delBtnSheet').forEach(b => b.onclick = () => delClient(b.dataset.id));
      sheetWrap.querySelectorAll('.notesInput').forEach(ta => {
        ta.addEventListener('change', () => {
          const cl = clients.find(x => x.id === ta.dataset.id);
          if(cl){ cl.notes = ta.value; save(); }
        });
      });
    }

    document.querySelectorAll('.remindBtn').forEach(b => b.onclick = () => remindClient(b.dataset.id));
    document.querySelectorAll('.topupBtn').forEach(b => b.onclick = () => topUp(b.dataset.id));
    document.querySelectorAll('.delBtn').forEach(b => b.onclick = () => delClient(b.dataset.id));
  }

  function remindClient(id){
    const c = clients.find(x => x.id === id);
    if(!c) return;
    const end = new Date(c.endDate + 'T00:00:00');
    const y = end.getFullYear();
    const m = String(end.getMonth()+1).padStart(2,'0');
    const d = String(end.getDate()).padStart(2,'0');
    const dateStr = `${y}${m}${d}`;
    const title = encodeURIComponent(`Top-up: ${c.name} ad budget`);
    const details = encodeURIComponent(`${c.name} ad amount theerunnu (Daily ₹${c.dailyBudget}, Amount ₹${c.amount}). Meta-il top-up cheyyuka.`);
    const url = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=${dateStr}/${dateStr}&details=${details}`;
    window.open(url, '_blank');
  }

  function topUp(id){
    const c = clients.find(x => x.id === id);
    if(!c) return;
    openModal(c);
  }
  function delClient(id){
    clients = clients.filter(x => x.id !== id);
    save(); render();
  }

  function openModal(existing){
    const isEdit = !!existing;
    const root = document.getElementById('modalRoot');
    const todayStr = new Date().toISOString().slice(0,10);
    const initEnd = isEdit ? existing.endDate : todayStr;
    root.innerHTML = `
      <div style="position:fixed; inset:0; background:rgba(0,0,0,0.45); display:flex; align-items:center; justify-content:center; z-index:10;">
        <div style="background:var(--surface-2); border-radius:12px; padding:1.5rem; width:320px; max-width:90%;">
          <div style="font-weight:500; font-size:16px; margin-bottom:1rem;">${isEdit ? 'Top up ' + existing.name : 'Add client'}</div>
          <div style="display:flex; flex-direction:column; gap:10px;">
            ${!isEdit ? `<div><label style="font-size:13px; color:var(--text-secondary);">Client name</label><input id="f_name" type="text" placeholder="e.g. FlyNex HR" style="width:100%;"/></div>` : ''}
            <div><label style="font-size:13px; color:var(--text-secondary);">Daily budget (&#8377;)</label><input id="f_daily" type="number" placeholder="e.g. 200" value="${isEdit ? existing.dailyBudget : ''}" style="width:100%;"/></div>
            <div><label style="font-size:13px; color:var(--text-secondary);">Top-up amount (&#8377;)</label><input id="f_amount" type="number" placeholder="e.g. 1400" value="${isEdit ? existing.amount : ''}" style="width:100%;"/></div>
            <div><label style="font-size:13px; color:var(--text-secondary);">Start date</label><input id="f_start" type="date" value="${todayStr}" style="width:100%;"/></div>
            <div><label style="font-size:13px; color:var(--text-secondary);">End date (auto, edit cheyyam)</label><input id="f_end" type="date" value="${initEnd}" style="width:100%;"/></div>
          </div>
          <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:1.25rem;">
            <button id="f_cancel">Cancel</button>
            <button id="f_save">${isEdit ? 'Save' : 'Add'}</button>
          </div>
        </div>
      </div>
    `;
    const dailyEl = document.getElementById('f_daily');
    const amountEl = document.getElementById('f_amount');
    const startEl = document.getElementById('f_start');
    const endEl = document.getElementById('f_end');
    function autoCalc(){
      const d = parseFloat(dailyEl.value);
      const a = parseFloat(amountEl.value);
      const s = startEl.value;
      if(d > 0 && a > 0 && s){
        endEl.value = calcEndDate(s, d, a);
      }
    }
    [dailyEl, amountEl, startEl].forEach(el => el.addEventListener('input', autoCalc));

    document.getElementById('f_cancel').onclick = () => root.innerHTML = '';
    document.getElementById('f_save').onclick = () => {
      const daily = parseFloat(dailyEl.value);
      const amount = parseFloat(amountEl.value);
      const start = startEl.value;
      const end = endEl.value;
      if(!daily || !amount || !start || !end){ return; }
      if(isEdit){
        existing.dailyBudget = daily;
        existing.amount = amount;
        existing.startDate = start;
        existing.endDate = end;
      } else {
        const name = document.getElementById('f_name').value.trim();
        if(!name) return;
        clients.push({ id: Date.now().toString(), name, dailyBudget: daily, amount, startDate: start, endDate: end, notes: '' });
      }
      save(); render();
      root.innerHTML = '';
    };
  }

  function openBulkModal(){
    const root = document.getElementById('modalRoot');
    const todayStr = new Date().toISOString().slice(0,10);
    root.innerHTML = `
      <div style="position:fixed; inset:0; background:rgba(0,0,0,0.45); display:flex; align-items:center; justify-content:center; z-index:10;">
        <div style="background:var(--surface-2); border-radius:12px; padding:1.5rem; width:460px; max-width:92%;">
          <div style="font-weight:500; font-size:16px; margin-bottom:6px;">Bulk add clients</div>
          <div style="font-size:12px; color:var(--text-secondary); margin-bottom:10px;">
            Oru line-il oru client. Format: <b>Name, Daily budget, Amount, Start date(dd/mm/yyyy)</b><br>
            Start date optional — vittal ${todayStr.split('-').reverse().join('/')} use aavum.
          </div>
          <textarea id="bulkText" rows="8" placeholder="FlyNex HR, 200, 1400, 10/07/2026
Edappal Paramedical, 300, 2100
SIMS Cherpulassery, 150, 1050, 09/07/2026"></textarea>
          <div id="bulkError" style="color:var(--text-danger); font-size:12px; margin-top:6px; display:none;"></div>
          <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:1.25rem;">
            <button id="bulk_cancel">Cancel</button>
            <button id="bulk_save">Add all</button>
          </div>
        </div>
      </div>
    `;
    document.getElementById('bulk_cancel').onclick = () => root.innerHTML = '';
    document.getElementById('bulk_save').onclick = () => {
      const raw = document.getElementById('bulkText').value.trim();
      const errBox = document.getElementById('bulkError');
      if(!raw){ return; }
      const lines = raw.split('\n').map(l => l.trim()).filter(Boolean);
      const added = [];
      const errors = [];
      lines.forEach((line, i) => {
        const parts = line.split(',').map(p => p.trim());
        const name = parts[0];
        const daily = parseFloat(parts[1]);
        const amount = parseFloat(parts[2]);
        let startStr = parts[3];
        let start;
        if(startStr){
          const m = startStr.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
          if(m){ start = `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`; }
        }
        if(!start) start = todayStr;
        if(!name || !daily || !amount){
          errors.push(`Line ${i+1}: "${line}" — format thetti`);
          return;
        }
        const end = calcEndDate(start, daily, amount);
        added.push({ id: Date.now().toString() + i, name, dailyBudget: daily, amount, startDate: start, endDate: end, notes: '' });
      });
      if(errors.length > 0){
        errBox.style.display = 'block';
        errBox.innerHTML = errors.join('<br>');
        if(added.length === 0) return;
      }
      clients = clients.concat(added);
      save(); render();
      root.innerHTML = '';
    };
  }

  document.getElementById('addBtn').onclick = () => openModal(null);
  document.getElementById('bulkBtn').onclick = () => openBulkModal();
  document.getElementById('viewToggle').onclick = () => {
    sheetView = !sheetView;
    document.getElementById('viewToggle').innerHTML = sheetView
      ? '<span class="arrow arrow-black" style="margin-right:5px;">&#8592;</span>Card view'
      : '<span class="arrow arrow-black" style="margin-right:5px;">&#8594;</span>Sheet view';
    render();
  };
  load();
})();
</script>

</body>
</html>
